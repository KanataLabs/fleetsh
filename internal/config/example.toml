# fleetsh example configuration; the schema is a draft until v0.1.
# Keep passwords, proxy passwords, tokens and private keys out of this file.
# Host and credential management commands are planned, not implemented yet.

[defaults]
connect_timeout = "10s"
command_timeout = "30m"
parallel = 10

