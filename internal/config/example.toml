# fleetsh example configuration; development schema.
# Keep passwords, proxy passwords, tokens and private keys out of this file.
# Create hosts with fleetsh add; secret values belong in the OS credential store.

[defaults]
connect_timeout = "10s"
command_timeout = "30m"
parallel = 10
# Optional global SSH proxy (SOCKS5 or HTTP/HTTPS CONNECT, no URL userinfo).
# proxy = "socks5://127.0.0.1:1080"
# proxy_credential = "local-proxy"

# Uncomment and adapt the host examples, or use fleetsh add.
# [hosts.hk1]
# host = "hk1.example.com"
# port = 22
# user = "ubuntu"
# connection = "ssh"
# auth = "key"
# key = "~/.ssh/id_ed25519"
# groups = ["asia", "web"]
# tags = ["production"]
# description = "Hong Kong web server"

# Named tunnels start only with fleetsh forward hk1 [NAME].
# Listen on loopback unless access from other machines is intended.
# [[hosts.hk1.forwards]]
# name = "web"
# type = "local"
# listen = "127.0.0.1:8080"
# destination = "127.0.0.1:80"

# [[hosts.hk1.forwards]]
# name = "reverse"
# type = "remote"
# listen = "127.0.0.1:9000"
# destination = "127.0.0.1:3000"

# [[hosts.hk1.forwards]]
# name = "socks"
# type = "dynamic"
# listen = "127.0.0.1:1080"

# [hosts.sg1]
# host = "sg1.example.com"
# user = "ubuntu"
# auth = "password"
# credential = "sg1-login"
# groups = ["asia"]

# [hosts.jump-hk]
# host = "jump.example.com"
# user = "ubuntu"
# auth = "agent"

# [hosts.private1]
# host = "10.0.0.10"
# user = "ubuntu"
# auth = "agent"
# proxy_jump = "jump-hk"

# [hosts.console1]
# host = "console.example.com"
# connection = "console-only"
# description = "Inventory only; never selected for remote execution"

# Proxy URL userinfo is forbidden; proxy secrets use credential references.
# A per-host proxy overrides defaults.proxy; proxy = "direct" bypasses it.
# [hosts.proxy1]
# host = "proxy-target.example.com"
# user = "ubuntu"
# auth = "agent"
# proxy = "socks5://127.0.0.1:1080"
# proxy_credential = "local-proxy"

# Custom commands are planned for v0.2.
# [commands.disk]
# command = "df -h"
