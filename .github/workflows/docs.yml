name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml', 'scripts/publish-docs.ps1']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml', 'scripts/publish-docs.ps1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - name: Build both documentation languages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./source/docs
          destination: ./_site
      - name: Upload rendered documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: ./_site
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISHER_PRIVATE_KEY: ${{ secrets.KANATALABS_PUBLISHER_PRIVATE_KEY }}
    steps:
      - name: Explain local App publication when CI credentials are absent
        if: env.PUBLISHER_PRIVATE_KEY == ''
        run: |
          echo "CI App credentials are not configured. Build passed; publish with scripts/publish-docs.ps1 and the local KanataLabs Publisher utility." >> "$GITHUB_STEP_SUMMARY"
      - name: Create organization Publisher App token
        if: env.PUBLISHER_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: '5232049'
          private-key: ${{ secrets.KANATALABS_PUBLISHER_PRIVATE_KEY }}
          owner: KanataLabs
          repositories: fleetsh
          permission-contents: write
      - if: env.PUBLISHER_PRIVATE_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          token: ${{ steps.app.outputs.token }}
      - if: env.PUBLISHER_PRIVATE_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: published
          token: ${{ steps.app.outputs.token }}
      - name: Sync documentation source with App identity
        if: env.PUBLISHER_PRIVATE_KEY != ''
        working-directory: published
        run: |
          git rm -r --ignore-unmatch .
          cp -R ../source/docs/. .
          git add --all
          if git diff --cached --quiet; then
            echo "Documentation already synchronized"
          else
            git config user.name "Kanata Labs"
            git config user.email "contact@kanatalabs.com"
            git commit -m "docs: publish from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      # App-authenticated pushes trigger the branch-based GitHub Pages build.
