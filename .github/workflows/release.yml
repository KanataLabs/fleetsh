name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_PRIVATE_KEY: ${{ secrets.KANATALABS_PUBLISHER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: go test ./... -timeout 120s
      - name: Package six targets with licenses and checksums
        shell: bash
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="fleetsh_${GITHUB_REF_NAME}_${os}_${arch}"
              mkdir -p "dist/$name"
              suffix=""
              if [ "$os" = windows ]; then suffix=".exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/fleetsh$suffix" ./cmd/fleetsh
              cp LICENSE README.md THIRD_PARTY_NOTICES.md "dist/$name/"
              cp -R licenses "dist/$name/"
              if [ "$os" = windows ]; then
                (cd "dist/$name" && zip -qr "../$name.zip" .)
              else
                tar -C "dist/$name" -czf "dist/$name.tar.gz" .
              fi
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Generate verified binary manifest for the persistent npm launcher
        run: node scripts/build-release-manifest.mjs "$GITHUB_REF_NAME" dist
      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleetsh-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/fleetsh-manifest.json
      - name: Create organization Publisher App token
        if: env.PUBLISHER_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: '5232049'
          private-key: ${{ secrets.KANATALABS_PUBLISHER_PRIVATE_KEY }}
          owner: KanataLabs
          repositories: fleetsh
          permission-contents: write
      - name: Publish with organization App identity
        if: env.PUBLISHER_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/fleetsh-manifest.json "${args[@]}"
      - name: Explain local App publication when CI credentials are absent
        if: env.PUBLISHER_PRIVATE_KEY == ''
        run: |
          echo "Packages are available in the fleetsh-release artifact. Publish with the local KanataLabs Publisher utility; releases must use the organization App identity." >> "$GITHUB_STEP_SUMMARY"
