name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -timeout 120s
      - name: Package six targets with licenses and checksums
        shell: bash
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="fleetsh_${GITHUB_REF_NAME}_${os}_${arch}"
              mkdir -p "dist/$name"
              suffix=""
              if [ "$os" = windows ]; then suffix=".exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/fleetsh$suffix" ./cmd/fleetsh
              cp LICENSE README.md THIRD_PARTY_NOTICES.md "dist/$name/"
              cp -R licenses "dist/$name/"
              if [ "$os" = windows ]; then
                (cd "dist/$name" && zip -qr "../$name.zip" .)
              else
                tar -C "dist/$name" -czf "dist/$name.tar.gz" .
              fi
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
