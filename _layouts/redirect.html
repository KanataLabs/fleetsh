<!doctype html>
<html lang="{{ page.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title | escape }} · fleetsh</title>
<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
<link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body><main class="redirect"><h1>{{ page.title }}</h1><p><a href="{{ page.redirect_to | relative_url }}">{{ page.link_label }}</a></p></main></body>
</html>
